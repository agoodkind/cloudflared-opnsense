name: Build FreeBSD packages

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      version: ${{ steps.check.outputs.version }}
      revision: ${{ steps.check.outputs.revision }}
    steps:
      - name: Decide version and revision
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          LATEST="$(curl -sL \
            https://api.github.com/repos/cloudflare/cloudflared/releases/latest \
            | jq -r .tag_name)"

          # Derive the highest published revision for this upstream version
          # directly from GitHub release tags, which are the authoritative source of truth.
          LAST_REV="$(gh release list \
            --repo agoodkind/cloudflared-opnsense \
            --limit 100 \
            --json tagName \
            --jq ".[] | .tagName | select(startswith(\"${LATEST}-freebsd-r\"))" \
            | sed "s/${LATEST}-freebsd-r//" \
            | sort -n \
            | tail -1)"
          LAST_REV="${LAST_REV:-0}"

          REV=$((LAST_REV + 1))

          echo "skip=false" >> "${GITHUB_OUTPUT}"
          echo "version=${LATEST}" >> "${GITHUB_OUTPUT}"
          echo "revision=${REV}" >> "${GITHUB_OUTPUT}"
          echo "Upstream: ${LATEST}  Last published revision: ${LAST_REV}  Building: r${REV}"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: Cross-compile for FreeBSD (build gate)
        run: |
          GOOS=freebsd GOARCH=amd64 \
            go build -buildvcs=false ./cmd/cloudflared-builder ./cmd/cloudflared-configd

      - name: shellcheck CI scripts
        run: |
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=error \
            scripts/ci/upload-r2.sh \
            scripts/ci/create-release.sh

  build:
    needs: [check, test]
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1.4.3
        with:
          release: "14.2"
          usesh: true
          prepare: |
            pkg upgrade -y
            pkg install -y go gmake git
          run: |
            set -e
            CF_VERSION="${{ needs.check.outputs.version }}"
            CF_REVISION="${{ needs.check.outputs.revision }}"
            REPO_DIR="${GITHUB_WORKSPACE}"
            WORK_DIR="${GITHUB_WORKSPACE}/.cache/cf-build"
            PKG_REPO_DIR="${GITHUB_WORKSPACE}/pkg-repo-build"

            rm -rf "${WORK_DIR}" "${PKG_REPO_DIR}"
            mkdir -p "${WORK_DIR}" "${PKG_REPO_DIR}/All"

            # Build the builder and configd binaries natively on FreeBSD.
            # -buildvcs=false avoids git safe-directory issues in the VM.
            cd "${REPO_DIR}"
            go build -buildvcs=false -o dist/cloudflared-builder ./cmd/cloudflared-builder
            go build -buildvcs=false -o dist/cloudflared-configd  ./cmd/cloudflared-configd

            # Run the Go builder for deterministic build/package/repo steps.
            "${REPO_DIR}/dist/cloudflared-builder" \
              -version "${CF_VERSION}" \
              -revision "${CF_REVISION}" \
              -repo-dir "${REPO_DIR}" \
              -work-dir "${WORK_DIR}" \
              -pkg-repo-dir "${PKG_REPO_DIR}" \
              build

            "${REPO_DIR}/dist/cloudflared-builder" \
              -version "${CF_VERSION}" \
              -revision "${CF_REVISION}" \
              -repo-dir "${REPO_DIR}" \
              -work-dir "${WORK_DIR}" \
              -pkg-repo-dir "${PKG_REPO_DIR}" \
              package

            "${REPO_DIR}/dist/cloudflared-builder" \
              -version "${CF_VERSION}" \
              -revision "${CF_REVISION}" \
              -repo-dir "${REPO_DIR}" \
              -work-dir "${WORK_DIR}" \
              -pkg-repo-dir "${PKG_REPO_DIR}" \
              repo

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.0
        with:
          name: pkg-build
          path: |
            pkg-repo-build
            pkg

  publish:
    needs: [check, build]
    if: >-
      needs.check.outputs.skip != 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: pkg-build
          path: _artifact

      - name: Upload packages and metadata to R2
        env:
          ARTIFACT_DIR: _artifact
        run: bash scripts/ci/upload-r2.sh

      - name: Create GitHub release
        env:
          VERSION: ${{ needs.check.outputs.version }}
          REVISION: ${{ needs.check.outputs.revision }}
          ARTIFACT_DIR: _artifact
        run: bash scripts/ci/create-release.sh
