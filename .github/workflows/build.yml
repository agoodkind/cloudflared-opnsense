name: Build FreeBSD packages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  pull_request:
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      revision: ${{ steps.check.outputs.revision }}
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v6
        with:
          go-version-file: builder/go.mod

      - name: Decide version and revision
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: cd builder && go run . -repo-dir "${GITHUB_WORKSPACE}" plan

  test:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Root module vet
        run: go vet ./...

      - name: Root module test
        run: go test -race -count=1 ./...

      - name: Cross-compile cloudflared-configd for FreeBSD
        run: |
          GOOS=freebsd GOARCH=amd64 \
            go build -trimpath -buildvcs=false ./cmd/cloudflared-configd

      - name: Cross-compile cloudflared-builder for FreeBSD
        run: |
          cd builder && GOOS=freebsd GOARCH=amd64 \
            go build -trimpath -buildvcs=false -o /dev/null .

  builder:
    uses: agoodkind/go-makefile/.github/workflows/_ci.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      go_version_file: builder/go.mod
      working_directory: builder

  build:
    needs: [check, test, builder]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1.4.7
        with:
          release: "14.2"
          usesh: true
          prepare: |
            pkg upgrade -y
            pkg install -y go gmake git
          run: |
            set -e
            CF_VERSION="${{ needs.check.outputs.version }}"
            CF_REVISION="${{ needs.check.outputs.revision }}"
            REPO_DIR="${GITHUB_WORKSPACE}"
            WORK_DIR="${GITHUB_WORKSPACE}/.cache/cf-build"
            PKG_REPO_DIR="${GITHUB_WORKSPACE}/pkg-repo-build"

            git config --global --add safe.directory "${REPO_DIR}"

            rm -rf "${WORK_DIR}" "${PKG_REPO_DIR}"
            mkdir -p "${WORK_DIR}" "${PKG_REPO_DIR}/All" "${REPO_DIR}/dist"

            # Build configd (root module) and the builder (its own module) with
            # reproducible flags so installed-file hashes reflect source, not the
            # build path or VCS stamp.
            cd "${REPO_DIR}"
            go build -trimpath -buildvcs=false -o dist/cloudflared-configd ./cmd/cloudflared-configd
            cd "${REPO_DIR}/builder"
            go build -trimpath -buildvcs=false -o "${REPO_DIR}/dist/cloudflared-builder" .

            # Run the Go builder for deterministic build/package/repo steps.
            for stage in build package repo; do
              "${REPO_DIR}/dist/cloudflared-builder" \
                -version "${CF_VERSION}" \
                -revision "${CF_REVISION}" \
                -repo-dir "${REPO_DIR}" \
                -work-dir "${WORK_DIR}" \
                -pkg-repo-dir "${PKG_REPO_DIR}" \
                "${stage}"
            done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pkg-build
          path: pkg-repo-build

  publish:
    needs: [check, build]
    if: >-
      needs.build.result == 'success' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.version }}
      REVISION: ${{ needs.check.outputs.revision }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: builder/go.mod

      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: pkg-build
          path: _artifact

      - name: Build the publisher
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          cd builder && go build -trimpath -buildvcs=false -o "${GITHUB_WORKSPACE}/dist/cloudflared-builder" .

      - name: Decide whether publish is needed
        id: publish_decision
        run: |
          dist/cloudflared-builder \
            -version "${VERSION}" \
            -revision "${REVISION}" \
            -repo-dir "${GITHUB_WORKSPACE}" \
            -pkg-repo-dir _artifact \
            -check-only publish

      - name: Skip publish
        if: steps.publish_decision.outputs.should_publish != 'true'
        run: |
          echo "Skipping publish: ${{ steps.publish_decision.outputs.publish_reason }}"

      - name: Publish to R2 and create the GitHub release
        if: steps.publish_decision.outputs.should_publish == 'true'
        run: |
          dist/cloudflared-builder \
            -version "${VERSION}" \
            -revision "${REVISION}" \
            -repo-dir "${GITHUB_WORKSPACE}" \
            -pkg-repo-dir _artifact \
            publish
